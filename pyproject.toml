[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexbet-engine"
version = "0.1.0"
description = "Responsible football value-betting research engine"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.setuptools.packages.find]
include = ["lexbet*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
